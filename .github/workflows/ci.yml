name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required project documentation
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/OPERATING_MODEL.md
          test -f docs/ARCHITECTURE.md
          test -f docs/FILE_DATABASE.md
          test -f docs/BRAND_GUIDE.md
          test -f docs/PERFORMANCE.md
          test -f docs/PRODUCT_ROADMAP.md
          test -f docs/diagrams/project-workflow.mmd
          test -f docs/RELEASE_RUNBOOK.md
          test -s assets/jd-logo.png
          grep -q 'assets/jd-logo.png' index.html
          test "$(grep -o 'assets/jd-logo.png' index.html | wc -l)" -ge 2

      - name: Validate JSON records against JSON Schema
        run: npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s data/schema/services.schema.json -d data/records/services.json

      - name: Validate YAML configuration
        run: >-
          ruby -e 'require "yaml"; Dir.glob("data/config/*.yml").sort.each { |path| YAML.safe_load_file(path, permitted_classes: [], aliases: false); puts "Valid YAML: #{path}" }'

      - name: Smoke-test public contact paths, page sections and local assets
        run: python3 .github/scripts/check_public_site.py

      - name: Test public-site metadata and image accessibility guards
        run: python3 -m unittest discover -s tests -p 'test_public_site_metadata.py' -v

      - name: Validate HTML files when present
        shell: bash
        run: |
          mapfile -t html_files < <(find . -type f -name '*.html' -not -path './.git/*' -not -path './node_modules/*')
          if [ "${#html_files[@]}" -eq 0 ]; then
            echo "No HTML files exist yet; HTML validation is skipped."
          else
            npx --yes html-validate@10 "${html_files[@]}"
          fi
